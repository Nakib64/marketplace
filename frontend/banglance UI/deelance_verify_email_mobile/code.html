<input class="otp-box w-11 h-13 text-center rounded-lg bg-surface-container-low text-on-surface font-code-sm text-[20px] font-semibold focus:outline-none focus:bg-surface-container-high transition-all shadow-inner" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="4"/>
<input class="otp-box w-11 h-13 text-center rounded-lg bg-surface-container-low text-on-surface font-code-sm text-[20px] font-semibold focus:outline-none focus:bg-surface-container-high transition-all shadow-inner" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text" value="2"/>
<input autofocus="" class="otp-box w-11 h-13 text-center rounded-lg bg-surface-container-low text-on-surface font-code-sm text-[20px] font-semibold focus:outline-none focus:bg-surface-container-high transition-all shadow-inner" inputmode="numeric" maxlength="1" pattern="[0-9]*" placeholder="•" type="text"/>
<input class="otp-box w-11 h-13 text-center rounded-lg bg-surface-container-low text-on-surface font-code-sm text-[20px] font-semibold focus:outline-none focus:bg-surface-container-high transition-all shadow-inner" inputmode="numeric" maxlength="1" pattern="[0-9]*" placeholder="•" type="text"/>
<input class="otp-box w-11 h-13 text-center rounded-lg bg-surface-container-low text-on-surface font-code-sm text-[20px] font-semibold focus:outline-none focus:bg-surface-container-high transition-all shadow-inner" inputmode="numeric" maxlength="1" pattern="[0-9]*" placeholder="•" type="text"/>
</div>
<!-- Expiry Countdown & Resend Option -->
<div class="flex items-center justify-between w-full bg-surface-container-low px-3.5 py-2.5 rounded-lg mb-space-lg">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[15px] text-on-surface-variant">schedule</span>
<span class="font-code-sm text-code-sm text-on-surface-variant" id="timer-display">Expires in 04:58</span>
</div>

</button>

</div>

</div>

</div>

<span>Need to update email?</span>
<span class="text-primary font-medium underline underline-offset-4">Edit Address</span>
</button>
</div>
</div>
<script>
  (function() {
    // Interactive OTP Input Behavior
    const otpContainer = document.getElementById('otp-container');
    if (otpContainer) {
      const inputs = otpContainer.querySelectorAll('input.otp-box');
      inputs.forEach((input, idx) => {
        input.addEventListener('input', (e) => {
          if (input.value.length === 1 && idx < inputs.length - 1) {
            inputs[idx + 1].focus();
          }
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && idx > 0) {
            inputs[idx - 1].focus();
          }
        });
      });
    }

    // Dynamic Countdown Timer Logic
    let totalSeconds = 298; // 04:58
    const timerElem = document.getElementById('timer-display');
    const timerInterval = setInterval(() => {
      if (totalSeconds <= 0) {
        clearInterval(timerInterval);
        if (timerElem) timerElem.textContent = 'Code expired';
        return;
      }
      totalSeconds--;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const formatted = 'Expires in ' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
      if (timerElem) timerElem.textContent = formatted;
    }, 1000);

    // Resend Pulse Feedback
    const resendBtn = document.getElementById('resend-trigger');
    if (resendBtn) {
      resendBtn.addEventListener('click', () => {
        totalSeconds = 300;
        const origText = resendBtn.innerHTML;
        resendBtn.innerHTML = '<span class="material-symbols-outlined text-[14px] animate-spin">sync</span><span>Sent!</span>';
        setTimeout(() => {
          resendBtn.innerHTML = origText;
        }, 1200);
      });
    }
  })();
</script></main></body></html>
